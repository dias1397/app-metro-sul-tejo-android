name: Android Build

on:
  pull_request:
    branches:
      - 'master'
      - 'develop'
  push:
    branches:
      - 'master'
      - 'develop'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: 21
          cache: gradle

      - name: Grant execution permissions to Gradle wrapper
        run: chmod +x gradlew

      - name: Decode app.properties file
        env:
          SECRETS_PROPERTIES: ${{ secrets.PROPERTIES_FILE }}
        run: |
          if [ -n "$SECRETS_PROPERTIES" ]; then
            echo -n "$SECRETS_PROPERTIES" | base64 --decode > app/src/main/assets/app.properties
          else
            echo "PROPERTIES_FILE is not set; using the checked-in app.properties"
          fi

      - name: Run Lint
        run: ./gradlew lint

      - name: Run Tests
        run: ./gradlew test

      - name: Build Project
        run: ./gradlew assemble
